<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css"
          integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
          crossorigin="anonymous">

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <script src="js/app.js"></script>

    <!-- Estilo customizado -->
    <style>
        body {
            background-color: #1A1A1A;
            color: #EAEAEA;
            font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
        }

        #main-content {
            margin-top: 40px;
        }

        .card {
            background-color: #242424;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #CFCFCF;
        }

        label {
            color: #B0B0B0;
            font-weight: 500;
        }

        .form-control {
            background-color: #1F1F1F;
            border: 1px solid #3A3A3A;
            color: #FFFFFF;
        }

        .form-control::placeholder {
            color: #8A8A8A;
        }

        .btn-primary {
            background-color: #3B82F6;
            border: none;
        }

        .btn-danger {
            background-color: #EF4444;
            border: none;
        }

        .btn-primary:disabled,
        .btn-danger:disabled {
            opacity: 0.5;
        }

        table {
            background-color: #242424;
        }

        table th {
            color: #CFCFCF;
            border-bottom: 1px solid #3A3A3A !important;
        }

        table td {
            color: #EAEAEA;
            border-top: 1px solid #2F2F2F !important;
        }

        .status {
            font-size: 13px;
            color: #9CA3AF;
        }
    </style>
</head>

<body>
<noscript>
    <h3 style="color: #EF4444; text-align: center; margin-top: 40px;">
        This application requires JavaScript enabled to work properly.
    </h3>
</noscript>

<div id="main-content" class="container">

    <!-- Connection Card -->
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-title">WebSocket Connection</div>

                <form class="form-inline">
                    <button id="connect" class="btn btn-primary" type="submit">
                        Connect
                    </button>
                    <button id="disconnect" class="btn btn-danger" type="submit" disabled>
                        Disconnect
                    </button>
                    <span class="status" style="margin-left: 15px;">
                        Manage your real-time connection
                    </span>
                </form>
            </div>
        </div>
    </div>

    <!-- Message Card -->
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-title">Send a message</div>

                <form class="form-inline" style="width: 100%;">
                    <div class="form-group" style="width: 80%;">
                        <input
                                type="text"
                                id="message"
                                class="form-control"
                                style="width: 100%;"
                                placeholder="Type your message here..."
                        >
                    </div>
                    <button id="send" class="btn btn-primary" type="submit" style="margin-left: 10px;">
                        Send
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Conversation -->
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-title">Conversation</div>

                <table id="conversation" class="table table">
                    <thead>
                    <tr>
                        <th>Messages</th>
                    </tr>
                    </thead>
                    <tbody id="greetings">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
</body>
</html>
